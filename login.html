<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo - RSVP Eventos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">
          <i class="fas fa-calendar-check"></i>
        </div>
      </div>

      <h1 class="auth-title">Área Administrativa</h1>
      <p class="auth-subtitle">Acesse o sistema para gerenciar seus eventos e confirmações</p>

      <!-- Card Informativo sobre Modo Demo -->
      <div class="auth-demo-badge">
        <i class="fas fa-info-circle"></i> Para testar em <strong>Modo Demo</strong>, utilize qualquer e-mail e senha.
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-mail <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="admin@evento.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha <span class="required">*</span></label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-footer">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="remember-me" checked> Manter conectado
          </label>
          <a href="#" onclick="openModal('reset-modal'); return false;">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          <i class="fas fa-sign-in-alt"></i> Entrar no Painel
        </button>
      </form>

      <div style="text-align: center; margin-top: 1rem;">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Alternar Tema Claro/Escuro" style="margin: 0 auto;">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Recuperação de Senha -->
  <div class="modal-overlay" id="reset-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Recuperar Senha</h3>
        <button class="btn-icon" onclick="closeModal('reset-modal')">&times;</button>
      </div>
      <form id="reset-password-form">
        <div class="modal-body">
          <p class="text-muted" style="margin-bottom: 1rem; font-size: 0.875rem;">
            Digite o seu e-mail cadastrado. Enviaremos as instruções para redefinição da sua senha.
          </p>
          <div class="form-group">
            <label class="form-label" for="reset-email">E-mail Cadastrado</label>
            <input type="email" id="reset-email" class="form-control" placeholder="seuemail@exemplo.com" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('reset-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Enviar Instruções</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase CDN & JS Modules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
